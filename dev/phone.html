<!doctype html><meta charset="utf-8"><title>Phone frame</title>
<!-- Headless Chrome can't go below 500 px wide, so test phone widths in a frame: phone.html?w=390&h=844&view=home&state=charging -->
<style>html,body{margin:0;background:#000}iframe{border:0;display:block}</style>
<script>
const q = new URLSearchParams(location.search), f = document.createElement("iframe");
f.width = q.get("w") || 390; f.height = q.get("h") || 844;
f.src = "harness.html?view=" + (q.get("view") || "home") + "&state=" + (q.get("state") || "parked") + (q.get("scroll") ? "&scroll=" + q.get("scroll") : "") + (q.get("fs") ? "&fs=" + q.get("fs") : "") + (q.get("car") ? "&car=" + q.get("car") : "");
document.addEventListener("DOMContentLoaded", () => document.body.appendChild(f));
</script>
